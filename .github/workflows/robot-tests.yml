name: Robot Framework CI

# Execute the workflow on pushes to main/develop
# and when a pull request is opened or updated.
on:
  push:
    branches:
      - main
      - develop
  pull_request:

# Root directory of the OpenCart QA project inside this repository.
env:
  OPENCART_PROJECT_PATH: web-accessibility-qa-portfolio

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      # Download the complete repository to the temporary GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Python version used by the automation project.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Robot Framework, SeleniumLibrary and all required dependencies.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.OPENCART_PROJECT_PATH }}/automation/robot-framework/requirements.txt

      # Build and start the local OpenCart environment with Docker Compose.
      - name: Start OpenCart
        working-directory: ${{ env.OPENCART_PROJECT_PATH }}
        run: docker compose up -d --build

      # Wait until OpenCart responds before starting the UI tests.
      - name: Wait for OpenCart
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8888 > /dev/null; then
              exit 0
            fi
            echo "Waiting for OpenCart..."
            sleep 5
          done
          exit 1

      # Execute the complete Robot Framework suite using headless Chrome.
      - name: Run Robot Framework tests
        working-directory: ${{ env.OPENCART_PROJECT_PATH }}/automation/robot-framework
        run: |
          robot \
            -v BROWSER_OPTIONS:"add_argument('--headless=new');add_argument('--no-sandbox');add_argument('--disable-dev-shm-usage')" \
            -d results/ci-reports \
            tests

      # Upload reports and screenshots even when one or more tests fail.
      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            ${{ env.OPENCART_PROJECT_PATH }}/automation/robot-framework/results/ci-reports/