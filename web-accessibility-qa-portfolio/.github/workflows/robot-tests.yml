name: Robot Framework CI

# Execute the workflow on every push to the main/develop branches
# and on every pull request.
on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:

      # Download the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the required Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Robot Framework and all Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/robot-framework/requirements.txt

      # Start the local OpenCart environment
      - name: Start OpenCart
        run: docker compose up -d --build

      # Wait until the application becomes available
      # before starting the UI tests.
      - name: Wait for OpenCart
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8888 > /dev/null; then
              exit 0
            fi
            echo "Waiting for OpenCart..."
            sleep 5
          done
          exit 1

      # Execute the Robot Framework test suite
      # Chrome runs in headless mode inside GitHub Actions.
      - name: Run Robot Framework tests
        working-directory: automation/robot-framework
        run: |
          robot \
            -v BROWSER_OPTIONS:"add_argument('--headless=new');add_argument('--no-sandbox');add_argument('--disable-dev-shm-usage')" \
            -d results/ci-reports \
            tests

      # Always publish the Robot reports, even if tests fail.
      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            automation/robot-framework/results/ci-reports/